<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.A. Chai Wala - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .toast { transition: all 0.3s ease-in-out; }
        .blinking-bg { animation: blink 1s infinite; }
        @keyframes blink { 0% { background-color: #fee2e2; } 50% { background-color: #fca5a5; } 100% { background-color: #fee2e2; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar -->
    <nav class="bg-orange-600 text-white p-4 shadow-md sticky top-0 z-40 flex justify-between items-center">
        <h1 class="text-2xl font-bold"><i class="fas fa-mug-hot mr-2"></i>Admin Panel</h1>
        <div class="flex gap-4 items-center">
            <!-- Sound Toggle -->
            <button id="soundToggleBtn" onclick="toggleSound()" class="bg-orange-700 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-2">
                <i id="soundIcon" class="fas fa-volume-mute"></i> <span id="soundText">Sound Off</span>
            </button>
            <button onclick="switchTab('orders')" id="tab-orders" class="font-bold border-b-2 border-white px-2 py-1">Live Orders</button>
            <button onclick="switchTab('customers')" id="tab-customers" class="opacity-70 hover:opacity-100 px-2 py-1">Customers</button>
            <button onclick="switchTab('menu')" id="tab-menu" class="opacity-70 hover:opacity-100 px-2 py-1">Menu Setup</button>
        </div>
    </nav>

    <div class="container mx-auto p-4 lg:p-8">
        
        <!-- Tab 1: Live Orders -->
        <div id="section-orders" class="space-y-6">
            <h2 class="text-2xl font-bold border-b pb-2 flex justify-between items-center">
                Live Orders
                <span id="pendingCountBadge" class="bg-red-500 text-white text-sm px-3 py-1 rounded-full hidden">0 Pending</span>
            </h2>
            <div id="liveOrdersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Orders will appear here -->
            </div>
        </div>

        <!-- Tab 2: Customers -->
        <div id="section-customers" class="space-y-6 hidden">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="text-2xl font-bold">Customer Directory</h2>
                <button onclick="document.getElementById('addCustomerModal').classList.remove('hidden')" class="bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-700 shadow-md">
                    + Naya Grahak Jodein
                </button>
            </div>
            <div id="customersContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Customers will appear here -->
            </div>
        </div>

        <!-- Tab 3: Menu Setup -->
        <div id="section-menu" class="space-y-6 hidden">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="text-2xl font-bold">Menu Setup</h2>
                <button onclick="document.getElementById('addMenuModal').classList.remove('hidden')" class="bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-700 shadow-md">
                    + Naya Item Jodein
                </button>
            </div>
            <div id="menuContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- Menu items will appear here -->
            </div>
        </div>

    </div>

    <!-- Modals -->
    <!-- Add/Edit Customer Modal -->
    <div id="addCustomerModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md">
            <h3 id="customerModalTitle" class="text-xl font-bold mb-4">Naya Grahak Banayein</h3>
            <input type="hidden" id="editCustomerId">
            <div class="space-y-4">
                <input type="text" id="custName" placeholder="Grahak ka Naam" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                <input type="text" id="custBusiness" placeholder="Dukan/Business ka Naam" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                <input type="text" id="custPhone" placeholder="Mobile Number" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                <textarea id="custAddress" placeholder="Pura Address" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none" rows="2"></textarea>
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="saveCustomer()" class="flex-1 bg-orange-600 text-white py-3 rounded-lg font-bold hover:bg-orange-700">Save Karein</button>
                <button onclick="closeCustomerModal()" class="flex-1 bg-gray-200 text-gray-800 py-3 rounded-lg font-bold hover:bg-gray-300">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Customer History Modal -->
    <div id="historyModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-2xl max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-xl font-bold" id="historyModalTitle">Khata (History)</h3>
                <button onclick="document.getElementById('historyModal').classList.add('hidden')" class="text-gray-500 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="historyListContainer" class="overflow-y-auto flex-1 space-y-3">
                <!-- History loads here -->
            </div>
        </div>
    </div>

    <!-- Add Menu Modal -->
    <div id="addMenuModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">Naya Item Jodein</h3>
            <div class="space-y-4">
                <div class="flex gap-2">
                    <input type="text" id="menuIcon" placeholder="Emoji (☕)" class="w-1/4 p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none text-center text-2xl">
                    <input type="text" id="menuName" placeholder="Item ka Naam" class="w-3/4 p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                </div>
                <input type="text" id="menuDesc" placeholder="Description (Optional)" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                <input type="text" id="menuCategory" placeholder="Category likhein (e.g., Chai, Snacks)" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                <input type="number" id="menuPrice" placeholder="Price (₹)" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="saveMenuItem()" class="flex-1 bg-orange-600 text-white py-3 rounded-lg font-bold hover:bg-orange-700">Add Item</button>
                <button onclick="document.getElementById('addMenuModal').classList.add('hidden')" class="flex-1 bg-gray-200 text-gray-800 py-3 rounded-lg font-bold hover:bg-gray-300">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Toasts container -->
    <div id="toastContainer" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 flex flex-col gap-2 z-50"></div>

    <!-- Audio Element -->
    <audio id="orderAlertSound" loop>
        <source src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" type="audio/ogg">
    </audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc, getDoc, serverTimestamp, where, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBNVfetxF7CGBLuO4yM8LnXued5Vn4p19Q",
            authDomain: "ba-chai-wala-a9f5d.firebaseapp.com",
            projectId: "ba-chai-wala-a9f5d",
            storageBucket: "ba-chai-wala-a9f5d.firebasestorage.app",
            messagingSenderId: "842026226138",
            appId: "1:842026226138:web:4aeee6b3f37e79abd3f0e3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Global State
        window.allCustomers = [];
        window.allMenu = [];
        window.isSoundEnabled = false;

        // Auth
        signInAnonymously(auth).catch(e => showToast("Database connection warning: " + e.message, "error"));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadCustomers();
                loadMenu();
                loadLiveOrders();
            }
        });

        // Toggle Sound function
        window.toggleSound = () => {
            window.isSoundEnabled = !window.isSoundEnabled;
            const btn = document.getElementById('soundToggleBtn');
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundText');
            const audio = document.getElementById('orderAlertSound');

            if(window.isSoundEnabled) {
                btn.classList.remove('bg-orange-700');
                btn.classList.add('bg-green-600');
                icon.className = "fas fa-volume-up";
                text.innerText = "Sound On";
                // Trick to unlock audio context on mobile/browsers
                audio.play().then(() => { audio.pause(); audio.currentTime = 0; }).catch(e=>console.log(e));
            } else {
                btn.classList.remove('bg-green-600');
                btn.classList.add('bg-orange-700');
                icon.className = "fas fa-volume-mute";
                text.innerText = "Sound Off";
                audio.pause();
                audio.currentTime = 0;
            }
        }

        // Tab Switcher
        window.switchTab = (tab) => {
            ['orders', 'customers', 'menu'].forEach(t => {
                document.getElementById('section-' + t).classList.add('hidden');
                document.getElementById('tab-' + t).classList.replace('opacity-100', 'opacity-70');
                document.getElementById('tab-' + t).classList.remove('border-b-2', 'border-white');
            });
            document.getElementById('section-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab).classList.replace('opacity-70', 'opacity-100');
            document.getElementById('tab-' + tab).classList.add('border-b-2', 'border-white');
        };

        // Customers Logic
        function loadCustomers() {
            const q = query(collection(db, "customers"));
            onSnapshot(q, (snapshot) => {
                window.allCustomers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderCustomers();
            });
        }

        function renderCustomers() {
            const container = document.getElementById('customersContainer');
            container.innerHTML = '';
            window.allCustomers.forEach(cust => {
                container.innerHTML += `
                    <div class="bg-white p-5 rounded-xl shadow border border-gray-100 relative">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-lg">${cust.name} <span class="text-sm text-gray-500 font-normal">(${cust.businessName})</span></h3>
                                <p class="text-sm text-gray-600"><i class="fas fa-phone mr-1"></i> ${cust.phone}</p>
                                <p class="text-sm text-gray-600"><i class="fas fa-map-marker-alt mr-1"></i> ${cust.address}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-sm text-gray-500">Total Billed</p>
                                <p class="text-xl font-bold text-green-600">₹${cust.totalBilled || 0}</p>
                            </div>
                        </div>
                        <div class="mt-4 flex flex-wrap gap-2">
                            <button onclick="copyCustomerLink('${cust.id}')" class="bg-orange-100 text-orange-700 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-orange-200">
                                <i class="fas fa-link mr-1"></i> Copy Link
                            </button>
                            <button onclick="showCustomerHistory('${cust.id}', '${cust.name}')" class="bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-blue-200">
                                <i class="fas fa-history mr-1"></i> Khata Dekhein
                            </button>
                            <button onclick="editCustomer('${cust.id}')" class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-gray-200 ml-auto">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        window.saveCustomer = async () => {
            const id = document.getElementById('editCustomerId').value;
            const name = document.getElementById('custName').value;
            const businessName = document.getElementById('custBusiness').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;

            if (!name || !phone) return showToast("Naam aur Phone number zaroori hai!", "error");

            try {
                if(id) {
                    await updateDoc(doc(db, "customers", id), { name, businessName, phone, address });
                    showToast("Grahak ki detail update ho gayi!");
                } else {
                    await addDoc(collection(db, "customers"), {
                        name, businessName, phone, address, totalBilled: 0, password: null, createdAt: serverTimestamp()
                    });
                    showToast("Naya Grahak Add Ho Gaya!");
                }
                closeCustomerModal();
            } catch (error) {
                showToast("Error: " + error.message, "error");
            }
        };

        window.editCustomer = (id) => {
            const c = window.allCustomers.find(x => x.id === id);
            if(c) {
                document.getElementById('editCustomerId').value = id;
                document.getElementById('custName').value = c.name;
                document.getElementById('custBusiness').value = c.businessName;
                document.getElementById('custPhone').value = c.phone;
                document.getElementById('custAddress').value = c.address;
                document.getElementById('customerModalTitle').innerText = "Grahak Update Karein";
                document.getElementById('addCustomerModal').classList.remove('hidden');
            }
        }

        window.closeCustomerModal = () => {
            document.getElementById('editCustomerId').value = '';
            document.getElementById('custName').value = '';
            document.getElementById('custBusiness').value = '';
            document.getElementById('custPhone').value = '';
            document.getElementById('custAddress').value = '';
            document.getElementById('customerModalTitle').innerText = "Naya Grahak Banayein";
            document.getElementById('addCustomerModal').classList.add('hidden');
        }

        window.copyCustomerLink = (id) => {
            const url = window.location.origin + window.location.pathname.replace('admin.html', 'customer.html') + '?id=' + id;
            const tempInput = document.createElement("input");
            tempInput.value = url;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand("copy");
                showToast("Link copy ho gaya! Ab WhatsApp par bhejein.");
            } catch (err) {
                showToast("Copy failed, please copy manually: " + url, "error");
            }
            document.body.removeChild(tempInput);
        };

        // Customer History (Khata)
        window.showCustomerHistory = async (customerId, customerName) => {
            document.getElementById('historyModalTitle').innerText = `${customerName} ka Khata`;
            document.getElementById('historyListContainer').innerHTML = '<p class="text-center p-4">Loading...</p>';
            document.getElementById('historyModal').classList.remove('hidden');

            const q = query(collection(db, "orders"), where("customerId", "==", customerId), orderBy("timestamp", "desc"));
            const snapshot = await getDocs(q);
            
            let html = '';
            let total = 0;
            snapshot.forEach(doc => {
                const o = doc.data();
                if(o.status === 'delivered') total += o.total;
                
                let statusClass = o.status === 'delivered' ? 'text-green-600' : (o.status === 'cancelled' ? 'text-red-500' : 'text-orange-500');
                
                html += `
                <div class="border p-3 rounded-lg flex justify-between items-center">
                    <div>
                        <p class="font-bold text-sm text-gray-800">${new Date(o.timestamp?.toDate()).toLocaleString()}</p>
                        <p class="text-xs text-gray-600 mt-1">${o.items.map(i => `${i.qty}x ${i.name}`).join(', ')}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-bold ${statusClass}">₹${o.total}</p>
                        <p class="text-xs uppercase font-bold ${statusClass}">${o.status}</p>
                    </div>
                </div>`;
            });

            if(snapshot.empty) html = '<p class="text-center text-gray-500 p-4">Koi purana order nahi hai.</p>';
            html += `<div class="mt-4 pt-2 border-t flex justify-between font-bold text-lg"><span>Total Successful Orders:</span><span class="text-green-600">₹${total}</span></div>`;
            
            document.getElementById('historyListContainer').innerHTML = html;
        }

        // Menu Logic
        function loadMenu() {
            const q = query(collection(db, "menu"));
            onSnapshot(q, (snapshot) => {
                window.allMenu = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderMenu();
            });
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';
            window.allMenu.forEach(item => {
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow border border-gray-100 relative">
                        <button onclick="deleteMenuItem('${item.id}')" class="absolute top-2 right-2 text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>
                        <div class="text-3xl text-center mb-2">${item.icon}</div>
                        <h3 class="font-bold text-center">${item.name}</h3>
                        <p class="text-xs text-center text-gray-500 bg-gray-100 rounded-full px-2 py-1 mt-1 mx-auto w-max">${item.category}</p>
                        <p class="text-center font-bold text-orange-600 mt-2">₹${item.price}</p>
                    </div>
                `;
            });
        }

        window.saveMenuItem = async () => {
            const name = document.getElementById('menuName').value;
            const icon = document.getElementById('menuIcon').value || '☕';
            const desc = document.getElementById('menuDesc').value;
            const price = Number(document.getElementById('menuPrice').value);
            const category = document.getElementById('menuCategory').value || 'Others';

            if (!name || !price) return showToast("Naam aur Price zaroori hai!", "error");

            try {
                await addDoc(collection(db, "menu"), { name, icon, desc, price, category });
                showToast("Menu Item Add Ho Gaya!");
                document.getElementById('addMenuModal').classList.add('hidden');
                document.getElementById('menuName').value = '';
                document.getElementById('menuPrice').value = '';
            } catch (error) {
                showToast("Error: " + error.message, "error");
            }
        };

        window.deleteMenuItem = async (id) => {
            if (confirm("Sach me delete karna hai?")) {
                await deleteDoc(doc(db, "menu", id));
                showToast("Item deleted!");
            }
        };

        // Live Orders Logic
        function loadLiveOrders() {
            const q = query(collection(db, "orders"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('liveOrdersContainer');
                container.innerHTML = '';
                let pendingCount = 0;
                
                snapshot.docs.forEach(docSnap => {
                    const order = { id: docSnap.id, ...docSnap.data() };
                    
                    // Don't show fully delivered or cancelled orders in live tab (only active ones)
                    if (order.status === 'delivered' || order.status === 'cancelled') return;

                    if (order.status === 'pending') pendingCount++;

                    const itemsHtml = order.items.map(i => `<li class="flex justify-between border-b border-dashed border-gray-200 py-1"><span>${i.qty}x ${i.name}</span> <span class="font-semibold">₹${i.price * i.qty}</span></li>`).join('');
                    
                    let actionButtons = '';
                    let cardClass = 'bg-white';
                    
                    if (order.status === 'pending') {
                        cardClass = 'bg-red-50 blinking-bg border-red-200 border-2';
                        actionButtons = `
                            <button onclick="updateOrderStatus('${order.id}', 'preparing')" class="w-full bg-orange-600 text-white py-2 rounded font-bold hover:bg-orange-700 mt-2 shadow-lg">✅ Accept Order</button>
                            <button onclick="updateOrderStatus('${order.id}', 'cancelled')" class="w-full bg-gray-200 text-red-600 py-2 rounded font-bold hover:bg-gray-300 mt-2">❌ Cancel</button>
                        `;
                    } else if (order.status === 'preparing') {
                        cardClass = 'bg-yellow-50 border-yellow-200 border-2';
                        actionButtons = `<button onclick="updateOrderStatus('${order.id}', 'dispatched')" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700 mt-2 shadow-lg">🚴‍♂️ Pack & Dispatch</button>`;
                    } else if (order.status === 'dispatched') {
                        cardClass = 'bg-green-50 border-green-200 border-2';
                        actionButtons = `<button onclick="updateOrderStatus('${order.id}', 'delivered', '${order.customerId}', ${order.total})" class="w-full bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700 mt-2 shadow-lg">🎉 Mark Delivered</button>`;
                    }

                    container.innerHTML += `
                        <div class="${cardClass} p-5 rounded-xl shadow-md transition-all">
                            <div class="flex justify-between items-start mb-3 border-b pb-2">
                                <div>
                                    <h3 class="font-bold text-lg text-gray-800">${order.customerName}</h3>
                                    <p class="text-xs text-gray-500">${order.customerAddress}</p>
                                </div>
                                <span class="bg-gray-800 text-white text-xs px-2 py-1 rounded uppercase font-bold">${order.status}</span>
                            </div>
                            <ul class="text-sm text-gray-700 mb-3 space-y-1">
                                ${itemsHtml}
                            </ul>
                            <div class="flex justify-between items-center font-bold text-lg text-gray-900 border-t pt-2">
                                <span>Total Bill:</span>
                                <span>₹${order.total}</span>
                            </div>
                            ${actionButtons}
                        </div>
                    `;
                });

                // Update Badge
                const badge = document.getElementById('pendingCountBadge');
                if (pendingCount > 0) {
                    badge.innerText = `${pendingCount} Pending`;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }

                // Handle Audio Alarm
                const audio = document.getElementById('orderAlertSound');
                if(window.isSoundEnabled) {
                    if(pendingCount > 0) {
                        let playPromise = audio.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(error => console.log("Audio blocked: Needs user interaction first"));
                        }
                    } else {
                        audio.pause();
                        audio.currentTime = 0;
                    }
                }
            });
        }

        window.updateOrderStatus = async (orderId, newStatus, customerId = null, total = 0) => {
            try {
                await updateDoc(doc(db, "orders", orderId), { status: newStatus });
                
                // If delivered, add to customer's total bill
                if (newStatus === 'delivered' && customerId) {
                    const custRef = doc(db, "customers", customerId);
                    const custSnap = await getDoc(custRef);
                    if(custSnap.exists()) {
                        const currentTotal = custSnap.data().totalBilled || 0;
                        await updateDoc(custRef, { totalBilled: currentTotal + total });
                    }
                }
                
                showToast(`Order status changed to ${newStatus}`);
            } catch(e) {
                showToast("Error updating order", "error");
            }
        };

        // Toast logic
        window.showToast = (msg, type = "success") => {
            const container = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `toast px-4 py-2 rounded shadow-lg text-white font-bold text-sm transform transition-all ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`;
            t.innerText = msg;
            container.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
        };

    </script>
</body>
</html>
